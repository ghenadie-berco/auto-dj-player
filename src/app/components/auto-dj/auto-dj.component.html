<!-- Extra Padding -->
<div class="flex-auto flex-col gap padding">
  <!-- DJ Decks -->
  <app-dj-decks class="component" (activeSongChange)="onActiveSongChange($event)"></app-dj-decks>
  <!-- Playlist -->
  <app-playlist class="flex-auto component"></app-playlist>
</div>
<!-- Controls -->
<app-controls 
  class="component"
  [playlistState]="playlistState()"
  (play)="onPlay()"
  (pause)="onPause()"
  (stop)="onStop()">
</app-controls>
