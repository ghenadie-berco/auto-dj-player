<div #waveSurferContainer class="view"></div>
@if(song()) {
<!-- Song Details -->
<div class="song-details flex-row">
  <div class="flex-auto align-left">
    <div>{{ song()!.title }}</div>
    <div><b>{{ song()!.artist }}</b></div>
  </div>
  <div class="align-right">
    <div>{{ remainingTime() == null ? '' : '-' + (remainingTime()! | songTime) }}</div>
  </div>
</div>
} @else {
<div class="view flex-row flex-centered flex-auto">No song has been loaded</div>
}
